name: Apply Multi-store Map Control

on:
  push:
    branches:
      - feat/multistore-floating-control
    paths:
      - backend/apply_multistore_map_control.py
      - backend/_test_multistore_events.py
      - .github/workflows/apply-multistore-map-control.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multistore-floating-control

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply map UI patch
        run: python backend/apply_multistore_map_control.py

      - name: Run multi-store regression tests
        run: python backend/_test_multistore_events.py

      - name: Validate diff
        run: git diff --check

      - name: Commit generated HTML
        shell: bash
        run: |
          git add public/taiwan-exhibition-map.html
          if git diff --cached --quiet; then
            echo "No generated HTML changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add multi-store map control"
          git push origin HEAD:feat/multistore-floating-control
