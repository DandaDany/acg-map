name: Agent Map Exploration Polish

on:
  push:
    branches:
      - agent/map-exploration-polish

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply filter polish
        run: python tools/patch_polish_1.py
      - name: Apply map exploration polish
        run: python tools/patch_polish_2.py
      - name: Apply decisions and regression updates
        run: python tools/patch_polish_3.py
      - name: Update rolling-week regression
        run: python tools/patch_polish_4.py
      - name: Map exploration regression
        run: python backend/_test_map_exploration_polish.py
      - name: Editorial C regression
        run: python backend/_test_editorial_c_home.py
      - name: Collection regression
        run: python backend/_test_editorial_collection_pages.py
      - name: Theme regression
        run: python backend/_test_theme_switch.py
      - name: Existing map UX regression
        run: |
          set +e
          python backend/_test_map_ux.py > /tmp/map-ux-polish.log 2>&1
          code=$?
          cat /tmp/map-ux-polish.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/map-ux-polish.log tools/_polish_failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/_polish_failure.txt
            git commit -m "chore: capture map ux regression failure"
            git push
            exit "$code"
          fi
      - name: Python compile check
        run: python -m py_compile backend/*.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/taiwan-exhibition-map.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('no inline script found')
          Path('/tmp/acg-map-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/acg-map-inline.js
      - name: Protect activity data
        run: test -z "$(git diff --name-only origin/main -- public/venues.json data/event_first_seen.json data/manual data/auto)"
      - name: Validate diff
        run: git diff --check
      - name: Commit implementation
        run: |
          rm -f tools/_polish_failure.txt
          rm tools/patch_polish_1.py tools/patch_polish_2.py tools/patch_polish_3.py tools/patch_polish_4.py
          rm .github/workflows/agent-map-exploration-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine map exploration and activity filters"
          git push
