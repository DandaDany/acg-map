name: Inspect Map Polish

on:
  push:
    branches:
      - agent/map-exploration-polish-inspect

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/inspect_map_polish.py
      - name: Commit snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/_inspect_map_polish.txt
          git commit -m "chore: capture map polish snippets"
          git push
