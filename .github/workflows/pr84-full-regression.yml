name: PR84 Full Regression (temporary)

on:
  push:
    branches:
      - 'agent/sync-main-into-map-ux'

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout combined branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install openpyxl requests beautifulsoup4 playwright

      - name: Run complete unittest discovery
        run: python -m unittest discover -s backend -p '_test_*.py' -v

      - name: Compile backend Python
        run: |
          set -e
          for f in backend/*.py; do python -m py_compile "$f"; done

      - name: Validate all inline JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          html = pathlib.Path('public/taiwan-exhibition-map.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          checked = 0
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(script)
                  path = f.name
              subprocess.run(['node', '--check', path], check=True)
              checked += 1
          print(f'inline scripts checked: {checked}')
          PY

      - name: Verify embedded DATA equals public venues JSON
        run: |
          python - <<'PY'
          import json, pathlib, re
          html = pathlib.Path('public/taiwan-exhibition-map.html').read_text(encoding='utf-8')
          m = re.search(r'const DATA=(\{.*?\});\s*const cityLabels=', html, flags=re.S)
          if not m:
              raise SystemExit('embedded DATA not found')
          embedded = json.loads(m.group(1))
          public = json.loads(pathlib.Path('public/venues.json').read_text(encoding='utf-8'))
          if embedded != public:
              raise SystemExit('embedded DATA != public/venues.json')
          print('embedded DATA == public/venues.json')
          PY

      - name: Git whitespace check
        run: git diff --check HEAD^
