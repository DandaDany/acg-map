button,input{font:inherit}
button{color:inherit}
a{color:inherit}
#app{height:100%;overflow:hidden;background:var(--bg)}

.icon-btn:hover,.icon-btn:focus-visible{border-color:var(--accent2);outline:none}
.homebtn{margin-left:auto}
.stat{margin:10px 0 14px;color:var(--muted);font-size:12.5px;line-height:1.5}
.stat b{color:var(--text);font-size:14px}
.search-shell{position:relative}
.searchbox{display:flex;align-items:center;gap:9px;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:#101620}
.searchbox:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(101,162,255,.12)}
.searchbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
.search-suggestions{display:none;position:absolute;z-index:1600;top:calc(100% + 7px);left:0;right:0;max-height:360px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:13px;background:#131925;box-shadow:0 16px 42px rgba(0,0,0,.5)}
.search-suggestions.show{display:block}
.search-option{display:flex;width:100%;align-items:center;gap:10px;padding:9px;border:0;border-radius:9px;background:transparent;text-align:left;cursor:pointer}
.search-option:hover,.search-option.active{background:#263044}
.search-kind{min-width:34px;color:var(--accent2);font-size:11px;font-weight:800}
.search-copy{min-width:0;flex:1}
.search-label,.search-sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-label{font-size:13px;font-weight:700}.search-sub{margin-top:2px;color:var(--muted);font-size:11px}
.search-empty{padding:14px;color:var(--muted);font-size:12px;text-align:center}
.filter-head{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:14px 0 8px;border-top:1px solid var(--line)}
.filter-head h2{margin:0;font-size:14px}
.filter-clear{border:0;background:transparent;color:var(--accent2);font-size:12px;font-weight:750;cursor:pointer}
.filter-clear:disabled{color:#657084;cursor:not-allowed;opacity:.7}
.filter-menu{display:flex;min-height:0;flex:1;flex-direction:column;gap:4px;overflow:auto}
.filter-category{display:grid;width:100%;grid-template-columns:26px minmax(72px,1fr) minmax(70px,1fr) 14px;align-items:center;gap:7px;padding:11px 8px;border:0;border-radius:11px;background:transparent;text-align:left;cursor:pointer}
.filter-category:hover,.filter-category.open{background:#242d3e}
.filter-icon{color:var(--muted);font-size:16px;text-align:center}
.filter-name{font-size:13px;font-weight:700}
.filter-value{overflow:hidden;color:var(--muted);font-size:12px;text-align:right;text-overflow:ellipsis;white-space:nowrap}
.filter-value.changed{color:var(--accent2);font-weight:750}
.filter-arrow{color:var(--muted);font-size:19px}
.filter-detail{display:none;position:fixed;z-index:1300;top:0;bottom:0;left:var(--sidebar);width:var(--sidebar);flex-direction:column;border-right:1px solid var(--line);background:#171d28;box-shadow:20px 0 42px rgba(0,0,0,.3)}
.filter-detail.show{display:flex}
.filter-detail-head{display:flex;min-height:64px;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}
.filter-detail-head h2{margin:0;font-size:15px}
.filter-back{width:42px;height:42px;border:0;border-radius:11px;background:transparent;font-size:22px;cursor:pointer}
.filter-back:hover{background:#263044}
.filter-options{min-height:0;flex:1;overflow:auto;padding:9px}
.filter-group{padding:13px 10px 5px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.2px}
.filter-option{display:grid;width:100%;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:11px 10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer}
.filter-option:hover:not(:disabled),.filter-option.selected{background:#263044}
.filter-option:disabled{color:#667084;cursor:not-allowed}
.filter-check{color:transparent}.filter-option.selected .filter-check{color:var(--accent2)}
.filter-count{min-width:28px;padding:2px 7px;border:1px solid #3b465b;border-radius:999px;color:var(--muted);font-size:11px;text-align:center}
.pin-legend{flex:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#111722}
.pin-legend[hidden]{display:none}.pin-legend h3{margin:0 0 9px;font-size:12px}.pin-legend-list{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.pin-legend-item{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10.5px}.pin-legend-symbol{display:grid;width:16px;height:16px;place-items:center;flex:none;border:2px solid #fff;border-radius:50% 50% 50% 5px;color:#fff;font-size:8px;transform:rotate(-45deg)}
.pin-legend-symbol>span{transform:rotate(45deg)}
.segmented{display:grid;grid-template-columns:1fr 1fr;padding:3px;border:1px solid var(--line);border-radius:12px;background:#101620}
.segmented button{min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:750;cursor:pointer}
.segmented button.active{background:#2b3650;color:var(--text);box-shadow:0 2px 9px rgba(0,0,0,.3)}

.discover-pane{display:flex;min-width:0;flex-direction:column}
.discover-head{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.discover-head h1{margin:0;font-size:24px}.discover-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.discover-mode{margin-top:10px;width:190px}.discover-mode button{min-height:32px}
.discover-count{color:var(--muted);font-size:12px}
.discover-list{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px;scrollbar-gutter:stable}
.event-card{overflow:hidden;margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 7px 20px rgba(0,0,0,.16)}
.event-card.desktop-clickable{display:grid;grid-template-columns:138px minmax(0,1fr);min-height:176px;cursor:pointer}
.event-card.desktop-clickable:hover{border-color:#465674;transform:translateY(-1px)}
.media-frame{position:relative;overflow:hidden;background:#0e121a}
.event-card.desktop-clickable>.media-frame{height:100%;min-height:176px}
.media-back{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(16px);opacity:.44;transform:scale(1.06)}
.media-front{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain}
.media-placeholder{display:grid;width:100%;height:100%;place-items:center;color:#596579;background:linear-gradient(145deg,#161d29,#0e121a)}
.card-body{min-width:0;padding:14px}
.card-tags,.detail-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;min-height:23px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10.5px;font-weight:700}
.tag.ongoing{color:var(--ongoing);border-color:#215341}.tag.upcoming{color:var(--upcoming);border-color:#304d70}.tag.ending{color:#fca5a5;border-color:#653137}
.tag.free{color:var(--free);border-color:#155e75}.tag.paid{color:var(--paid);border-color:#831843}.tag.form{color:#c4b5fd;border-color:#493d72}
.tag.city{color:#93c5fd;border-color:#2b4a6f}
.event-card h2{margin:10px 0 7px;font-size:16px;line-height:1.38}
.card-summary,.meta-row{color:var(--muted);font-size:12px;line-height:1.55}
.card-summary strong,.meta-row strong{color:var(--text);font-weight:650}
.mobile-detail{display:none}
.empty-state{display:grid;min-height:280px;place-items:center;padding:30px;text-align:center}
.empty-state p{margin:0 0 14px;color:var(--muted)}
.empty-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.primary-btn,.secondary-btn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:750;cursor:pointer}
.primary-btn{border:0;background:var(--accent2);color:white}.secondary-btn{border:1px solid var(--line);background:#151c28}

.map-pane{position:relative;min-width:0;min-height:0;background:#e8ebe6}
#map{position:absolute;inset:0;z-index:1;background:#e8ebe6}
.desktop-map-search{position:absolute;z-index:1100;top:14px;left:14px;width:min(430px,calc(100% - 220px))}.desktop-map-search .searchbox{box-shadow:0 7px 22px rgba(0,0,0,.18)}
.map-tools{position:absolute;z-index:1000;top:66px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.map-nav-stack{display:flex;flex-direction:column;align-items:center;gap:7px}
.map-tool{display:grid;min-width:44px;height:44px;place-items:center;border:1px solid rgba(25,31,42,.18);border-radius:13px;background:rgba(255,255,255,.94);color:#1b2430;box-shadow:0 7px 22px rgba(0,0,0,.16);cursor:pointer}
.map-zoom-tool{font-size:21px;font-weight:700;line-height:1}.leaflet-control-zoom{display:none}
/* 多店・無單一地址活動：排列在 home 鍵下方的獨立懸浮圓圈 */
.floating-events{display:flex;flex-direction:column;align-items:center;gap:8px}
.floating-events:empty{display:none}
.floating-event{position:relative;width:44px;height:44px;padding:0;border:0;background:transparent;cursor:pointer;transition:transform .12s ease}
.floating-event:hover,.floating-event:focus-visible{transform:scale(1.1);outline:none}
.floating-event-face{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;border:2px solid #fff;border-radius:50%;background:var(--fc,#18202c);box-shadow:0 7px 22px rgba(0,0,0,.22)}
.floating-event:hover .floating-event-face,.floating-event:focus-visible .floating-event-face{border-color:var(--accent2)}
.floating-event img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.floating-event-glyph{color:#fff;font-size:18px;font-weight:800;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.floating-event-badge{position:absolute;z-index:3;right:-3px;bottom:-3px;display:grid;min-width:17px;height:17px;place-items:center;padding:0 3px;border:2px solid var(--bg);border-radius:999px;background:var(--accent2);color:#fff;font-size:9px;font-weight:800}
.floating-event .soondot{top:-2px;left:-2px}
.map-marker-toggle{position:absolute;z-index:1000;top:14px;right:14px;width:160px;background:rgba(16,22,32,.94);box-shadow:0 7px 22px rgba(0,0,0,.22)}
.map-legend{display:none}
.leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;padding:0;white-space:nowrap;font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.leaflet-tooltip.lbl:before{display:none;border:0}
.lbl-city{font-size:15px;color:#1b1b1b;letter-spacing:.5px}
.lbl-town{font-size:12px;color:#46505e}
.leaflet-container{font-family:inherit}
.pinwrap{position:relative;width:40px;height:52px;cursor:pointer;transition:transform .16s ease;transform-origin:50% 100%}
.pinsvg{display:block;overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));transition:transform .12s ease;transform-origin:50% 100%}
.pinwrap.approx .pinsvg{opacity:.7}
.pinwrap::after{content:"";position:absolute;inset:-6px;border-radius:14px}
.marker-badge{position:absolute;z-index:3;top:-3px;right:-3px;display:grid;min-width:18px;height:18px;place-items:center;padding:0 4px;border:2px solid var(--bg);border-radius:999px;background:var(--accent2);color:#fff;font-size:11px;font-weight:800}
.pinwrap.approx .marker-badge{background:#7c8aa6}
.soondot{position:absolute;z-index:3;top:-2px;left:-2px;width:12px;height:12px;border:2px solid var(--bg);border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px rgba(255,90,95,.4)}
.kv-marker-shell{position:relative;display:flex;width:94px;height:76px;align-items:flex-end;justify-content:center;transition:transform .16s ease;transform-origin:50% 100%}
.kv-marker{position:relative;width:58px;height:74px;border:3px solid white;border-radius:12px;background:#18202c;box-shadow:0 5px 16px rgba(0,0,0,.42);transition:width .16s ease,height .16s ease,transform .16s ease}
.kv-marker.landscape{width:92px;height:58px}
.kv-marker-body{position:absolute;inset:0;overflow:hidden;border-radius:9px}
.kv-marker .media-back{filter:blur(8px);opacity:.55}.kv-marker .media-front{object-fit:contain;object-position:center}
.kv-marker>.marker-badge{top:-7px;right:-7px;border-color:#fff;background:#e53935}
.pinwrap.is-selected,.pinwrap.is-hovered,.kv-marker-shell.is-selected,.kv-marker-shell.is-hovered{transform:scale(1.3)}
.pinwrap.is-selected .pinsvg{transform:none}
.pinwrap.is-selected .pinsvg>path:first-child{stroke:#ff2d2d}
.kv-marker-shell.is-selected .kv-marker{border-color:#ff2d2d}
.cl{display:flex;width:44px;height:44px;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.9);border-radius:50%;background:#3a86ff;color:white;box-shadow:0 4px 14px rgba(0,0,0,.38);font-size:13px;font-weight:850}.cl-md{background:#ff914d}.cl-lg{width:50px;height:50px;background:#ff6469}
.leaflet-bottom.leaflet-right{margin:0 8px 8px 0}

.dialog-overlay,.lightbox,.mobile-filter-overlay{display:none;position:fixed;z-index:3000;inset:0;background:rgba(4,7,12,.76)}
.dialog-overlay.show,.lightbox.show,.mobile-filter-overlay.show{display:flex}
.dialog-overlay{align-items:center;justify-content:center;padding:36px 48px}
.dialog-close{position:fixed;z-index:2;top:18px;right:20px;border-color:rgba(255,255,255,.28);background:rgba(14,18,25,.78);font-size:22px}
.dialog-panel{width:min(920px,calc(100vw - 96px));height:min(760px,calc(100dvh - 72px));overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 28px 80px rgba(0,0,0,.62)}
.dialog-back{margin:14px 14px 0;border:0;background:transparent;color:var(--accent2);font-weight:750;cursor:pointer}
.dialog-panel:has(.dialog-back) .event-detail{height:calc(100% - 48px);padding-top:8px}
.event-detail{display:grid;height:100%;min-height:0;grid-template-columns:minmax(280px,42%) minmax(0,1fr);gap:22px;padding:20px;overflow:hidden}
.event-detail>.media-frame{min-height:430px;border-radius:14px}
.detail-copy{display:flex;min-height:0;flex-direction:column;overflow:hidden}
.detail-copy h2{margin:11px 0;font-size:25px;line-height:1.35}
.detail-section{margin-top:17px;padding-top:14px;border-top:1px solid var(--line)}
.detail-section h3{margin:0 0 10px;font-size:13px}
.location-list{display:flex;flex-direction:column;gap:8px}
.location-list.primary-location{flex:none}
.locations-section{display:flex;min-height:0;flex-direction:column}
.location-row{padding:10px;border:1px solid var(--line);border-radius:11px;background:#111722}
.location-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.location-name{font-size:13px;font-weight:750}.location-date,.location-address{margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.45}
.text-link,.action-btn{display:inline-flex;min-height:42px;align-items:center;justify-content:center;border-radius:11px;text-decoration:none;font-size:12.5px;font-weight:750;cursor:pointer}
.location-actions{display:flex;flex:none;align-items:center;gap:9px}
.location-nav{display:inline-grid;min-width:44px;min-height:44px;place-items:center;border:0;background:transparent;color:var(--accent2);text-decoration:none;font-size:11px;font-weight:750}
.location-nav:hover{text-decoration:none;color:#9cc4ff}
.action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.action-btn{padding:0 14px;border:1px solid var(--line);background:#151d2a}
.action-btn.primary{border-color:#3c6da8;background:#203c62;color:#cfe3ff}
.popup-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.popup-arrow{display:grid;width:44px;height:44px;place-items:center;border:1px solid var(--line);border-radius:50%;background:#151d2a;color:#aab4c3;font-size:22px;cursor:pointer}
.popup-arrow:hover:not(:disabled){border-color:#66748a;color:#fff}.popup-arrow:disabled{opacity:.28;cursor:default}
.popup-position{color:var(--muted);font-size:11px}
.popup-metadata{display:grid;gap:2px;margin-top:7px}
.nearby-cta{display:flex;width:100%;min-height:44px;align-items:center;justify-content:space-between;margin-top:10px;padding:0;border:0;background:transparent;color:#ff9a4d;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
.nearby-cta:hover{color:#ffb478;text-decoration:underline}
.event-picker{height:100%;overflow:auto;padding:20px}.event-picker h2{margin:0 0 16px;font-size:22px}
.event-picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.picker-card{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;cursor:pointer}
.picker-card:hover{border-color:var(--accent2)}
.picker-card .media-frame{height:220px}.picker-copy{padding:11px}.picker-copy h3{margin:0 0 6px;font-size:14px;line-height:1.4}
.activity-picker-overlay{display:none;position:fixed;z-index:3600;inset:0;background:rgba(4,7,12,.92);overflow:auto}
.activity-picker-overlay.show{display:block}.activity-picker-panel{min-height:100dvh;padding:clamp(22px,4vw,52px)}
.activity-picker-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;max-width:1200px;margin:0 auto 18px}
.activity-picker-head h2{margin:0 0 4px;font-size:clamp(22px,3vw,34px)}.activity-picker-count{color:var(--muted)}
.activity-picker-close{display:grid;width:44px;height:44px;flex:none;place-items:center;border:1px solid rgba(255,255,255,.28);border-radius:12px;background:#151d2a;color:#fff;font-size:24px;cursor:pointer}
.activity-picker-grid{display:grid;max-width:1200px;margin:0 auto;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px}
.activity-picker-slot{display:grid;min-height:426px;place-items:center;padding:12%}
.activity-picker-card{width:77%;min-width:0;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);text-align:left;cursor:pointer;transition:transform .16s ease,border-color .16s ease}
.activity-picker-card.is-hovered{z-index:1;border-color:#ff9a4d;transform:scale(1.3)}
.activity-picker-card .media-frame{height:220px}.activity-picker-copy{display:block;min-height:105px;padding:11px}.activity-picker-copy h3{display:-webkit-box;min-height:58.8px;margin:0 0 7px;overflow:hidden;font-size:14px;line-height:1.4;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.activity-picker-secondary{display:block;color:var(--muted);font-size:12px;line-height:1.45}

.lightbox{align-items:center;justify-content:center;padding:36px}
.lightbox img{display:block;max-width:100%;max-height:100%;object-fit:contain;touch-action:auto}
.lightbox-close{position:fixed;top:16px;right:16px;background:rgba(14,18,25,.75);font-size:22px}
.toast{position:fixed;z-index:5000;left:50%;bottom:30px;max-width:calc(100vw - 40px);padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:#111722;color:var(--text);font-size:12px;opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mobile-top,.mobile-tabs,.mobile-filter-overlay,.mobile-venue-sheet{display:none}

@media(max-width:1100px) and (min-width:761px){
  :root{--sidebar:292px;--discover:340px}
  .desktop-shell{min-width:880px}
  .filter-pane{padding-left:12px;padding-right:12px}
}
@media(max-width:760px){
  :root{--mobile-top:68px}
  html,body,#app{height:100dvh}
  .desktop-shell{display:block;min-width:0;height:100dvh}
  .filter-pane{display:none}
  .discover-pane{position:fixed;z-index:5;inset:var(--mobile-top) 0 calc(var(--mobile-nav) + env(safe-area-inset-bottom,0px));border:0}
  .discover-head{padding:12px 14px 10px}
  .discover-head h1{font-size:21px}.discover-head p{display:none}
  .discover-list{padding:10px 12px 22px}
  .event-card.desktop-clickable{display:block;min-height:0;cursor:default;transform:none}
  .event-card.desktop-clickable>.media-frame{height:auto;max-height:200px;aspect-ratio:16/9}
  .card-body{padding:14px}
  .event-card h2{font-size:18px}
  .mobile-detail{display:block}
  .desktop-only-summary{display:none}
  .mobile-detail .card-summary{margin-top:5px}
  .mobile-detail .detail-section{margin-top:13px;padding-top:11px}
  .mobile-detail .location-row{background:#161d29}
  .mobile-detail .action-row{margin-top:12px}
  .kv-lightbox-btn{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}
  .map-pane{display:none;position:fixed;z-index:4;inset:var(--mobile-top) 0 calc(var(--mobile-nav) + env(safe-area-inset-bottom,0px))}
  body.mobile-map .discover-pane{display:none}
  body.mobile-map .map-pane{display:block}
  .desktop-map-search{display:none}
  .discover-intents{padding:9px 12px 0}
  .map-tools{top:66px;right:10px}
  .map-marker-toggle{top:10px;right:auto;left:50%;width:148px;transform:translateX(-50%)}
  .map-marker-toggle button{min-height:44px}
  .map-legend{display:flex;position:absolute;z-index:1000;top:68px;left:50%;max-width:calc(100vw - 132px);gap:11px;overflow-x:auto;transform:translateX(-50%);padding:6px 13px;border-radius:999px;background:rgba(16,22,32,.94);box-shadow:0 7px 22px rgba(0,0,0,.22);scrollbar-width:none}
  .map-legend::-webkit-scrollbar{display:none}
  .map-legend[hidden]{display:none}
  .map-legend-item{display:flex;flex:none;align-items:center;gap:5px;color:#e6ecf5;font-size:11px;font-weight:650;white-space:nowrap}

/* ===== Warm / dark theme switch ===== */
.editorial-actions{display:flex;align-items:center;gap:8px}
.theme-switch{position:relative;width:54px;height:30px;flex:none;padding:2px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);cursor:pointer;box-shadow:0 5px 16px rgba(70,52,38,.07)}

.theme-switch-icon{position:absolute;z-index:1;top:50%;font-size:12px;line-height:1;transform:translateY(-50%);transition:opacity .18s ease}

.theme-switch-knob{position:absolute;z-index:2;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(70,52,38,.2);transition:transform .2s ease,background .2s ease}

function parseD(value){
  if(!value) return null;
  const parts=String(value).replace(/-/g,'/').split('/');
  if(parts.length<3) return null;
  const date=new Date(+parts[0],+parts[1]-1,+parts[2]);
  return Number.isNaN(date.getTime())?null:date;
}
function dateValue(value,fallback){
  const date=parseD(value);
  return date?date.getTime():fallback;
}
function formatDate(value){return value||'日期未定'}
function esc(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function safeUrl(value,asset=false){
  const raw=String(value||'').trim();
  if(!raw) return '';
  try{
    const parsed=new URL(raw,location.href);
    if(/^https?:$/.test(parsed.protocol)) return parsed.href;
    if(asset&&parsed.protocol==='file:') return parsed.href;
  }catch(error){}
  return '';
}
function normalizeText(value){return String(value||'').replace(/臺/g,'台').replace(/\s+/g,' ').trim().toLowerCase()}
function publicText(value){
  const text=String(value||'').trim();
  return text.includes('需人工確認')?'':text;
}
function canonicalUrl(value){
  const raw=String(value||'').trim();
  if(!raw) return '';
  try{
    const url=new URL(raw,location.href);
    [...url.searchParams.keys()].forEach(key=>{
      const lower=key.toLowerCase();
      if(lower.startsWith('utm_')||['fbclid','gclid','igsh','ref','source'].includes(lower)) url.searchParams.delete(key);
    });
    url.hash='';
    url.pathname=url.pathname.replace(/\/$/,'')||'/';
    return url.href;
  }catch(error){return raw.split('#')[0].replace(/\/$/,'')}
}
function shortHash(value){
  let hash=2166136261;
  for(let i=0;i<value.length;i++){hash^=value.charCodeAt(i);hash=Math.imul(hash,16777619)}
  return (hash>>>0).toString(16).padStart(8,'0');
}
function publicEventId(event){
  if(event.id) return String(event.id);
  const year=(String(event.s||'').match(/20\d{2}/)||[''])[0];
  return 'auto-js-'+shortHash([normalizeText(event.t),canonicalUrl(event.l),normalizeText(event.ip),normalizeText(event.org),year].join('|'));
}
function venueId(venue,index){return 'venue-'+index+'-'+shortHash([venue.name,venue.la,venue.lo].join('|'))}
function chooseValue(items,key){
  return items.map(item=>String(item.event[key]||'').trim()).filter(Boolean).sort((a,b)=>(b.length-a.length)||a.localeCompare(b,'zh-Hant'))[0]||'';
}
function chooseImage(items){
  const images=items.map(item=>String(item.event.img||'').trim()).filter(Boolean);
  return images.sort((a,b)=>{
    const localA=/\/(kv|_kv_cache)\//.test(a)||a.startsWith('kv/');
    const localB=/\/(kv|_kv_cache)\//.test(b)||b.startsWith('kv/');
    return Number(localB)-Number(localA);
  })[0]||'';
}
function occurrenceStatus(location){
  const start=parseD(location.start),end=parseD(location.end);
  if(start&&start>TODAY) return {kind:'upcoming',label:'即將開始',rank:2};
  if(end&&end<TODAY) return {kind:'ended',label:'已結束',rank:4};
  if(end){
    const days=Math.round((end-TODAY)/86400000);
    if(days>=0&&days<=ENDING_SOON_DAYS) return {kind:'ending',label:'即將結束 · 剩 '+days+' 天',rank:0};
    return {kind:'ongoing',label:'進行中',rank:0};
  }
  return {kind:'ongoing',label:'進行中',rank:1,permanent:true};
}
function deriveActivityStatus(group){
  const statuses=group.locations.map(occurrenceStatus);
  const active=statuses.filter(status=>status.kind==='ongoing'||status.kind==='ending');
  if(active.length){
    const ending=active.find(status=>status.kind==='ending');
    if(ending) return ending;
    return active.some(status=>!status.permanent)?{kind:'ongoing',label:'進行中',rank:0}:{kind:'ongoing',label:'進行中',rank:1,permanent:true};
  }
  if(statuses.some(status=>status.kind==='upcoming')) return {kind:'upcoming',label:'即將開始',rank:2};
  return {kind:'ended',label:'已結束',rank:4};
}
function buildActivityGroups(data){
  const grouped=new Map();
  const venueIndex=new Map();
  (data.venues||[]).forEach((venue,index)=>{
    venue._id=venueId(venue,index);
    const occurrences=[];
    (venue.ex||[]).forEach(event=>{
      if(event.c!=='ACG') return;
      const id=publicEventId(event);
      event.id=id;
      const location={
        id:venue._id+'-'+id,
        venue,venueId:venue._id,venueName:publicText(venue.name),
        city:publicText(venue.city),address:publicText(venue.addr),lat:+venue.la,lng:+venue.lo,
        start:event.s||'',end:event.e||'',event
      };
      location.status=occurrenceStatus(location);
      occurrences.push(location);
      if(!grouped.has(id)) grouped.set(id,[]);
      grouped.get(id).push(location);
    });
    venueIndex.set(venue._id,occurrences);
  });

  const out=new Map();
  grouped.forEach((locations,id)=>{
    const items=locations.map(location=>({event:location.event,location}));
    const event=items[0].event;
    const starts=locations.map(location=>dateValue(location.start,Infinity)).filter(Number.isFinite);
    const ends=locations.map(location=>dateValue(location.end,-Infinity)).filter(Number.isFinite);
    const group={
      id,title:publicText(event.t)||'未命名活動',ip:publicText(chooseValue(items,'ip')),organizer:publicText(chooseValue(items,'org')),
      licensor:publicText(chooseValue(items,'lic')),link:chooseValue(items,'l'),image:chooseImage(items),
      fee:publicText(chooseValue(items,'fee')),form:publicText(chooseValue(items,'c2'))||'其他',
      multiFilter:publicText(chooseValue(items,'mf')),firstSeen:chooseValue(items,'first_seen')||null,locations,
      overallStart:starts.length?new Date(Math.min(...starts)) : null,
      overallEnd:ends.length?new Date(Math.max(...ends)) : null
    };
    group.status=deriveActivityStatus(group);
    group.activeEnd=Math.min(...locations.filter(location=>['ongoing','ending'].includes(location.status.kind)).map(location=>dateValue(location.end,Infinity)));
    group.nextStart=Math.min(...locations.filter(location=>location.status.kind==='upcoming').map(location=>dateValue(location.start,Infinity)));
    out.set(id,group);
  });
  activityGroups=out;
  venueEventIndex=venueIndex;
  return out;
}
function buildFloatingGroups(list){
  floatingGroups=[];
  (list||[]).forEach((item,index)=>{
    if(!item||!item.title) return;
    const link=String(item.link||'').trim();
    const id=item.id||('floating-'+shortHash([normalizeText(item.title),canonicalUrl(link),index].join('|')));
    const event={id,t:item.title,c:'ACG',c2:item.form||'',s:item.start||'',e:item.end||'',l:link,img:item.image||'',fee:item.fee||'',ip:item.ip||'',org:item.organizer||'',lic:item.licensor||'',mf:item.multiFilter||''};
    const location={
      id:id+'-loc',venueId:'floating-'+id,venue:null,
      venueName:publicText(item.venueName||''),city:'',address:FLOATING_ADDRESS_TEXT,
      lat:NaN,lng:NaN,start:item.start||'',end:item.end||'',event,
      noAddress:true,floatingLink:safeUrl(link)
    };
    location.status=occurrenceStatus(location);
    const group={
      id,title:publicText(item.title)||'未命名活動',ip:publicText(item.ip||''),organizer:publicText(item.organizer||''),
      licensor:publicText(item.licensor||''),link,image:item.image||'',fee:publicText(item.fee||''),
      form:publicText(item.form||'')||'其他',multiFilter:publicText(item.multiFilter||''),locations:[location],
      overallStart:parseD(item.start),overallEnd:parseD(item.end),floating:true
    };
    group.status=deriveActivityStatus(group);
    group.activeEnd=Math.min(...group.locations.filter(loc=>['ongoing','ending'].includes(loc.status.kind)).map(loc=>dateValue(loc.end,Infinity)));
    group.nextStart=Math.min(...group.locations.filter(loc=>loc.status.kind==='upcoming').map(loc=>dateValue(loc.start,Infinity)));
    activityGroups.set(id,group);
    floatingGroups.push(group);
  });
}
function dateString(date){
  if(!date||!Number.isFinite(date.getTime())) return '';
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('/');
}
function groupDateText(group){
  const pairs=new Set(group.locations.map(location=>(location.start||'')+'|'+(location.end||'')));
  if(pairs.size===1){
    const first=group.locations[0];
    if(first.start&&first.end) return first.start+' ～ '+first.end;
    return first.start||first.end||'日期未定';
  }
  const start=dateString(group.overallStart),end=dateString(group.overallEnd);
  return [start,end].filter(Boolean).join(' ～ ')+'（各地日期不同）';
}
function locationDateText(location){
  if(location.start&&location.end) return location.start+' ～ '+location.end;
  return location.start||location.end||'日期未定';
}
function sortDiscoverActivities(groups){
  return [...groups].sort((a,b)=>{
    const rankA=a.status.rank,rankB=b.status.rank;
    if(rankA!==rankB) return rankA-rankB;
    const valueA=rankA<=1?a.activeEnd:a.nextStart;
    const valueB=rankB<=1?b.activeEnd:b.nextStart;
    if(valueA!==valueB) return valueA-valueB;
    return a.title.localeCompare(b.title,'zh-Hant')||a.id.localeCompare(b.id);
  });
}
function groupMatchesQuery(group,query){
  const q=normalizeText(query);
  if(!q) return true;
  const hay=[group.title,group.ip,group.organizer,group.licensor,
    ...group.locations.flatMap(location=>[location.venueName,location.city,location.address])].map(normalizeText).join(' ');
  return hay.includes(q);
}
function groupMatchesFilters(group,filters,ignoreKey){
  if(ignoreKey!=='city'&&filters.city!=='all'&&!group.locations.some(location=>location.city===filters.city)) return false;
  if(ignoreKey!=='time'&&filters.time!=='all'&&!group.locations.some(location=>locationMatchesTimeFilter(location,filters.time))) return false;
  if(ignoreKey!=='form'&&filters.form!=='all'&&group.form!==filters.form) return false;
  if(ignoreKey!=='fee'&&filters.fee!=='all'&&group.fee!==filters.fee) return false;
  if(ignoreKey!=='multi'&&filters.multi!=='all'&&group.multiFilter!==filters.multi) return false;
  return true;
}
function getFilteredActivityGroups(state=uiState,overrides={},ignoreKey=''){
  const filters={...state.filters,...overrides};
  return sortDiscoverActivities([...activityGroups.values()].filter(group=>
    group.status.kind!=='ended'&&groupMatchesFilters(group,filters,ignoreKey)&&groupMatchesQuery(group,state.query)
  ));
}
function taipeiCalendarToday(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const values=Object.fromEntries(parts.map(part=>[part.type,part.value]));
  return values.year+'-'+values.month+'-'+values.day;
}
function calendarDayNumber(value){
  const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match?Date.UTC(+match[1],+match[2]-1,+match[3])/86400000:NaN;
}
function eventCalendarDayNumber(value){return calendarDayNumber(String(value||'').replace(/\//g,'-'))}
function locationOverlapsCalendarRange(location,startDay,endDay){
  const rawStart=eventCalendarDayNumber(location.start),rawEnd=eventCalendarDayNumber(location.end);
  const start=Number.isFinite(rawStart)?rawStart:rawEnd,end=Number.isFinite(rawEnd)?rawEnd:rawStart;
  return Number.isFinite(start)&&Number.isFinite(end)&&start<=endDay&&end>=startDay;
}
function timeFilterDate(value){const match=String(value||'').match(/^date:(\d{4}-\d{2}-\d{2})$/);return match?match[1]:''}
function locationActiveOnCalendarDay(location,day){
  const start=eventCalendarDayNumber(location.start),end=eventCalendarDayNumber(location.end);
  if(Number.isFinite(start)&&day<start)return false;
  if(Number.isFinite(end)&&day>end)return false;
  return Number.isFinite(start)||Number.isFinite(end)||location.status.kind==='ongoing'||location.status.kind==='ending';
}
function locationMatchesTimeFilter(location,value){
  const selectedDate=timeFilterDate(value);
  if(selectedDate){const day=calendarDayNumber(selectedDate);return Number.isFinite(day)&&locationActiveOnCalendarDay(location,day)}
  if(value==='all')return true;
  return location.status.kind===value;
}
function formatMonthDay(dayNumber){const date=new Date(dayNumber*86400000);return (date.getUTCMonth()+1)+'/'+date.getUTCDate()}
function isLatestGroup(group,today=taipeiCalendarToday()){
  const days=calendarDayNumber(today)-calendarDayNumber(group.firstSeen);
  return Number.isFinite(days)&&days>=0&&days<=6;
}
function getLatestActivityGroups(state=uiState){return getFilteredActivityGroups(state).filter(group=>isLatestGroup(group))}
function sortDiscoverModeGroups(groups){
  if(uiState.discoverSort!=='distance'||!uiState.userLocation)return groups;
  return [...groups].sort((a,b)=>(nearestLocationForGroup(a)?.distanceMeters??Infinity)-(nearestLocationForGroup(b)?.distanceMeters??Infinity)||a.title.localeCompare(b.title,'zh-Hant')||a.id.localeCompare(b.id));
}
function getDiscoverModeGroups(){const groups=uiState.discoverMode==='latest'?getLatestActivityGroups():getFilteredActivityGroups();return sortDiscoverModeGroups(groups)}
function facetBaseGroups(state=uiState){
  let groups=[...activityGroups.values()].filter(group=>group.status.kind!=='ended');
  if(state.exploreView==='collection'&&state.collectionContext==='latest')groups=groups.filter(group=>isLatestGroup(group));
  return groups;
}
function getFacetCount(key,value,state=uiState){
  const filters={...state.filters,[key]:value};
  const base=facetBaseGroups(state);
  if(key==='multi'){
    const groups=base.filter(group=>
      group.multiFilter&&(value==='all'||group.multiFilter===value)
      &&groupMatchesFilters(group,filters,'multi')&&groupMatchesQuery(group,state.query)
    );
    return groups.reduce((sum,group)=>sum+group.locations.filter(location=>occurrenceVisible(location,filters)).length,0);
  }
  return base.filter(group=>groupMatchesFilters(group,filters,'')&&groupMatchesQuery(group,state.query)).length;
}
function occurrenceVisible(location,filters){
  if(location.status.kind==='ended') return false;
  if(filters.city!=='all'&&location.city!==filters.city) return false;
  if(filters.time!=='all'&&!locationMatchesTimeFilter(location,filters.time)) return false;
  return true;
}

const HOME_NEARBY_MAX_M=20000;
const COLLECTION_BATCH_DESKTOP=8,COLLECTION_BATCH_MOBILE=6;
function homeImageHtml(group,className='home-card-media'){
  const src=safeUrl(group.image,true);
  if(!src)return '<span class="'+className+'"><span class="home-placeholder">主視覺敬請期待</span></span>';
  return '<span class="'+className+'"><img src="'+esc(src)+'" alt="" loading="lazy" decoding="async"></span>';

function homeVisibleLocations(group){
  return group.locations.filter(location=>occurrenceVisible(location,uiState.filters));
}
function homeWeekLocations(group,startDay,endDay){
  return homeVisibleLocations(group).filter(location=>locationOverlapsCalendarRange(location,startDay,endDay));
}
function homeEditorialRank(group,todayDay){
  const locations=homeWeekLocations(group,todayDay,todayDay+6);
  const endDays=locations.map(location=>eventCalendarDayNumber(location.end)).filter(Number.isFinite).filter(day=>day>=todayDay);
  const nearestEnd=endDays.length?Math.min(...endDays):Infinity;
  if(nearestEnd<=todayDay+3)return [0,nearestEnd];
  const startDays=locations.map(location=>eventCalendarDayNumber(location.start)).filter(Number.isFinite).filter(day=>day>=todayDay&&day<=todayDay+6);
  if(startDays.length)return [1,Math.min(...startDays)];
  if(isLatestGroup(group))return [2,-calendarDayNumber(String(group.firstSeen||''))];
  return [3,nearestEnd];
}
function pickEditorialDiverse(groups,limit){
  const selected=[],selectedIds=new Set(),seenIp=new Set(),seenForm=new Set();
  const add=(group)=>{selected.push(group);selectedIds.add(group.id);if(group.ip)seenIp.add(normalizeText(group.ip));if(group.form)seenForm.add(group.form)};
  [0,1,2].some(pass=>{
    groups.forEach(group=>{
      if(selected.length>=limit||selectedIds.has(group.id))return;
      const ipKey=group.ip?normalizeText(group.ip):'';
      const newIp=!ipKey||!seenIp.has(ipKey),newForm=!group.form||!seenForm.has(group.form);
      if((pass===0&&newIp&&newForm)||(pass===1&&newIp)||pass===2)add(group);
    });
    return selected.length>=limit;
  });
  return selected;
}
function getHomeWeekGroups(){
  const todayDay=calendarDayNumber(taipeiCalendarToday());
  const groups=getFilteredActivityGroups().filter(group=>safeUrl(group.image,true)&&homeWeekLocations(group,todayDay,todayDay+6).length);
  groups.sort((a,b)=>{
    const ra=homeEditorialRank(a,todayDay),rb=homeEditorialRank(b,todayDay);
    return ra[0]-rb[0]||ra[1]-rb[1]||a.title.localeCompare(b.title,'zh-Hant')||a.id.localeCompare(b.id);
  });
  return pickEditorialDiverse(groups,5);
}
function homeRepresentativeLocation(group){

function homeDateLabel(group){

  const start=group.overallStart?Date.UTC(group.overallStart.getFullYear(),group.overallStart.getMonth(),group.overallStart.getDate())/86400000:NaN;
  const end=group.overallEnd?Date.UTC(group.overallEnd.getFullYear(),group.overallEnd.getMonth(),group.overallEnd.getDate())/86400000:NaN;
  if(Number.isFinite(start)&&start>todayDay&&start<=todayDay+6)return formatMonthDay(start)+' 開始';
  if(Number.isFinite(end)&&end>=todayDay)return '至 '+formatMonthDay(end);
  return '進行中';
}

function requestHomeLocation(button,onReady=null){
  if(uiState.userLocation){if(onReady)onReady();return}
  if(!navigator.geolocation){showToast('此瀏覽器不支援定位功能');return}
  if(button){button.disabled=true;button.setAttribute('aria-busy','true')}
  navigator.geolocation.getCurrentPosition(position=>{
    if(button){button.disabled=false;button.removeAttribute('aria-busy')}
    const lat=Number(position.coords.latitude),lng=Number(position.coords.longitude);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)){showToast('無法取得目前位置');return}
    uiState.userLocation={lat,lng};renderUserLocationMarker();renderEditorialHome();if(onReady)onReady();
  },error=>{
    if(button){button.disabled=false;button.removeAttribute('aria-busy')}
    showToast(error&&error.code===1?'未取得定位權限，請允許瀏覽器使用位置':'定位失敗，請稍後再試');
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}

  if(z>=11){ if(map.hasLayer(cityLabels))map.removeLayer(cityLabels); if(!map.hasLayer(townLabels))map.addLayer(townLabels); }

}

});

const DESTINATION_VENUE_GROUPS=[
  {id:'huashan1914',label:'華山1914文化創意產業園區',aliases:['華山1914文化創意產業園區']},
  {id:'songshan-cultural-park',label:'松山文創園區',aliases:['松山文創園區']},

  {id:'chiayi-cultural-park',label:'嘉義文化創意產業園區',aliases:['嘉義文化創意產業園區']}
];
function destinationVenueGroup(location){
  const name=normalizeText(location&&location.venueName);
  return DESTINATION_VENUE_GROUPS.find(group=>group.aliases.some(alias=>normalizeText(alias)===name))||null;
}
function destinationClusterInfo(items){
  if(!items.length)return null;
  const groups=items.map(item=>destinationVenueGroup(item.location));
  if(groups.some(group=>!group))return null;
  const ids=new Set(groups.map(group=>group.id));
  if(ids.size!==1)return null;
  const eventIds=new Set(items.map(item=>item.eventId));
  return eventIds.size>1?{group:groups[0],eventIds}:null;
}
function clusterPickerItems(clusterLayer){
  const seen=new Set();
  return clusterLayer.getAllChildMarkers().map(marker=>{
    if(!marker.locationId||seen.has(marker.locationId))return null;
    seen.add(marker.locationId);
    const location=locationById(marker.locationId);
    const group=location&&activityGroups.get(location.event.id);
    return location&&group?{eventId:group.id,locationId:location.id,group,location}:null;
  }).filter(Boolean);
}
function handleClusterActivate(clusterLayer){
  if(!clusterLayer)return;
  const items=clusterPickerItems(clusterLayer);
  const destination=!MOBILE_QUERY.matches?destinationClusterInfo(items):null;
  if(destination){openActivityPicker({mode:'cluster',items,title:destination.group.label+'的活動'});return}
  if(map.getZoom()<map.getMaxZoom())clusterLayer.zoomToBounds();
  else clusterLayer.spiderfy();
}
cluster.on('clusterclick',event=>{L.DomEvent.stopPropagation(event);handleClusterActivate(event.layer)});
function wireClusterKeyboard(){
  document.querySelectorAll('.marker-cluster').forEach(icon=>{icon.tabIndex=0;icon.setAttribute('role','button');icon.setAttribute('aria-label','查看這個區域的活動')});
}
cluster.on('animationend spiderfied unspiderfied',()=>requestAnimationFrame(wireClusterKeyboard));
map.getContainer().addEventListener('keydown',event=>{
  if(event.key!=='Enter'||MOBILE_QUERY.matches)return;
  const icon=event.target.closest('.marker-cluster');if(!icon)return;
  const layer=Object.values(map._layers).find(item=>item&&item._icon===icon&&typeof item.getAllChildMarkers==='function');
  if(layer){event.preventDefault();handleClusterActivate(layer)}
});

  '主題餐廳':{c:'#e08a3c',g:'<g transform="translate(20 19)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-5 -6 H4 V4 a2 2 0 0 1 -2 2 H-3 a2 2 0 0 1 -2 -2 Z"/><path d="M4 -3.5 a3.2 3.2 0 0 1 0 6.5"/></g>'},

function venueForm(locations){
  for(const location of locations){
    const group=activityGroups.get(location.event.id);
    const current=(group&&group.form)||location.event.c2;
    if(current&&FORM_ICON[current]) return current;
  }
  return '展覽';
}
function venueHasSoon(locations){
  return locations.some(location=>location.status.kind==='ending');
}
function pinSvg(form){
  const icon=FORM_ICON[form]||FORM_ICON['展覽'];
  return '<svg class="pinsvg" viewBox="0 0 40 52" width="40" height="52" aria-hidden="true">'
    +'<path d="M20 2C11.2 2 4 9 4 18c0 12 16 32 16 32s16-20 16-32C36 9 28.8 2 20 2Z" fill="'+icon.c+'" stroke="#fff" stroke-width="2.5"/>'
    +'<circle cx="20" cy="19" r="12.6" fill="rgba(0,0,0,.12)"/>'
    +icon.g+'</svg>';
}
function markerIcon(venueIdValue,locations){
  const ids=[...new Set(locations.map(location=>location.event.id))];
  const count=ids.length;
  const group=activityGroups.get(ids[0]);
  const markerLabel=esc((locations[0]&&locations[0].venueName||'活動地點')+' · '+((group&&group.title)||'活動')+'，按下查看');
  const badge=count>1?'<span class="marker-badge">'+count+'</span>':'';
  if(uiState.markerMode==='image'&&group&&safeUrl(group.image,true)){
    const image=safeUrl(group.image,true);
    const size=MOBILE_QUERY.matches?[86,68]:[94,76];
    return L.divIcon({className:'',iconSize:size,iconAnchor:[size[0]/2,size[1]-2],
      html:'<div class="kv-marker-shell" role="button" aria-label="'+markerLabel+'"><div class="kv-marker"><div class="kv-marker-body"><img class="media-back" src="'+esc(image)+'" alt=""><img class="media-front" src="'+esc(image)+'" alt=""></div>'+badge+'</div></div>'});
  }
  const venue=locations[0]&&locations[0].venue;
  const approximate=!venue||venue.loc!=='exact';
  const soon=venueHasSoon(locations);
  const classes='pinwrap'+(approximate?' approx':'')+(soon?' hassoon':'');
  return L.divIcon({className:'',iconSize:[40,52],iconAnchor:[20,50],
    html:'<div class="'+classes+'" role="button" aria-label="'+markerLabel+'">'+pinSvg(venueForm(locations))+badge+(soon?'<span class="soondot" aria-label="含即將結束活動"></span>':'')+'</div>'});
}
function classifyKvMarker(marker){
  const element=marker.getElement();
  const image=element&&element.querySelector('.kv-marker .media-front');
  if(!image) return;
  const apply=()=>{const card=image.closest('.kv-marker');if(card)card.classList.toggle('landscape',image.naturalWidth>=image.naturalHeight)};
  if(image.complete&&image.naturalWidth) apply(); else image.addEventListener('load',apply,{once:true});
}
function sortVenueGroups(groups){return sortDiscoverActivities(groups)}
function focusMapLocation(location,zoom=13,onComplete=null){
  if(!location||!Number.isFinite(+location.lat)||!Number.isFinite(+location.lng)) return;
  const target=[+location.lat,+location.lng];
  const nextZoom=Math.max(map.getZoom(),zoom);
  if(map.getCenter().distanceTo(target)<2&&map.getZoom()===nextZoom){if(onComplete)onComplete();return}
  if(onComplete)map.once('moveend',onComplete);
  map.flyTo(target,nextZoom,{animate:!matchMedia('(prefers-reduced-motion:reduce)').matches,duration:.55});
}
let expandedClusterLatLng=null;
cluster.on('spiderfied',function(event){
  const children=event.markers||[];
  if(children.length){const ll=children[0].getLatLng();expandedClusterLatLng=[ll.lat,ll.lng]}
});
cluster.on('unspiderfied',function(){
  expandedClusterLatLng=null;
});
function restoreExpandedCluster(){
  if(!expandedClusterLatLng) return;
  const target=expandedClusterLatLng;
  const marker=markers.find(function(m){const ll=m.getLatLng();return Math.abs(ll.lat-target[0])<1e-8&&Math.abs(ll.lng-target[1])<1e-8});
  if(!marker){expandedClusterLatLng=null;return}
  const parent=cluster.getVisibleParent(marker);
  if(parent&&typeof parent.spiderfy==='function') parent.spiderfy();
  else expandedClusterLatLng=null;
}
function renderMapMarkers(){
  expandedClusterLatLng=null;
  cluster.clearLayers();markers=[];
  (DATA.venues||[]).forEach(venue=>{
    if(!Number.isFinite(+venue.la)||!Number.isFinite(+venue.lo)) return;
    const locations=getFilteredVenueOccurrences(venue._id);
    if(!locations.length) return;
    const seen=new Set();
    locations.forEach(location=>{
      if(seen.has(location.event.id)) return;
      seen.add(location.event.id);
      const marker=L.marker([+venue.la,+venue.lo],{icon:markerIcon(venue._id,[location])});
      marker.groupCount=1;
      marker.venueId=venue._id;
      marker.eventId=location.event.id;
      marker.locationId=location.id;
      marker.isHovered=false;
      marker.on('add',()=>requestAnimationFrame(()=>{classifyKvMarker(marker);applyMarkerVisualState(marker)}));
      marker.on('mouseover',()=>{if(MOBILE_QUERY.matches)return;marker.isHovered=true;applyMarkerVisualState(marker)});
      marker.on('mouseout',()=>{if(MOBILE_QUERY.matches)return;marker.isHovered=false;applyMarkerVisualState(marker)});
      marker.on('click',event=>{
        L.DomEvent.stopPropagation(event);
        selectLocation(location.id,{openPopup:true,revealMarker:true,recenter:false,updateHistory:true});
      });
      markers.push(marker);
    });
  });
  cluster.addLayers(markers);
  renderUserLocationMarker();
  requestAnimationFrame(wireClusterKeyboard);
  const selected=uiState.selectedLocationId;
  const visibleLocationIds=new Set(markers.map(marker=>marker.locationId));
  if(uiState.lastViewedLocationId&&!visibleLocationIds.has(uiState.lastViewedLocationId))uiState.lastViewedLocationId=null;
  if(selected&&!visibleLocationIds.has(selected)) closeActiveMapPopup({clearSelection:true,updateHistory:true});
  else requestAnimationFrame(()=>{
    highlightSelectedMarker();
    if(selected&&uiState.tab==='map')revealMarkerForLocation(selected,selectionVersion);
    if(selected&&MOBILE_QUERY.matches&&document.getElementById('mobileVenueSheet').classList.contains('show')){
      const location=locationById(selected);if(location)openMobileVenueSheet(location.venueId,location.event.id);
    }
  });
}
function applyMarkerVisualState(marker){
  const highlighted=marker.locationId===(uiState.selectedLocationId||uiState.lastViewedLocationId);
  marker.setZIndexOffset(marker.isHovered?2000:(highlighted?1000:0));
  const element=marker.getElement();
  const root=element&&element.querySelector('.pinwrap,.kv-marker-shell');
  if(root){root.classList.toggle('is-selected',highlighted);root.classList.toggle('is-hovered',!!marker.isHovered)}
}
function highlightSelectedMarker(){
  markers.forEach(applyMarkerVisualState);
}
function locationById(locationId){
  for(const locations of venueEventIndex.values()){
    const location=locations.find(item=>item.id===locationId);
    if(location)return location;
  }
  return null;
}
function clearSelection(){
  selectionVersion++;
  uiState.selectedLocationId=null;uiState.selectedVenueId=null;uiState.selectedEventId=null;
  mapSelectionActive=false;highlightSelectedMarker();
}
function revealMarkerForLocation(locationId,version=selectionVersion,onRevealed=null){
  const marker=markers.find(item=>item.locationId===locationId);
  if(!marker)return false;
  const finish=()=>{
    if(version!==selectionVersion||uiState.selectedLocationId!==locationId)return;
    highlightSelectedMarker();if(onRevealed)onRevealed(marker);
  };
  cluster.zoomToShowLayer(marker,()=>{
    if(version!==selectionVersion||uiState.selectedLocationId!==locationId)return;
    const parent=cluster.getVisibleParent(marker);
    if(parent&&parent!==marker&&typeof parent.spiderfy==='function'){
      cluster.once('spiderfied',finish);parent.spiderfy();
    }else finish();
  });
  return true;
}
function ensureMapVisible(version,onVisible){
  if(MOBILE_QUERY.matches&&uiState.tab!=='map')setTab('map',{explicitTarget:true});
  requestAnimationFrame(()=>{
    if(version!==selectionVersion)return;
    map.invalidateSize();uiState.mapHasVisibleView=true;onVisible();
  });
}
function selectLocation(locationId,options={}){
  const settings={openPopup:true,revealMarker:true,recenter:true,updateHistory:true,...options};
  const location=locationById(locationId);
  if(!location||!occurrenceVisible(location,uiState.filters)||!getFilteredActivityGroups().some(group=>group.id===location.event.id)){
    closeActiveMapPopup({clearSelection:true,updateHistory:settings.updateHistory});return false;
  }
  const version=++selectionVersion;
  uiState.selectedLocationId=location.id;uiState.selectedVenueId=location.venueId;uiState.selectedEventId=location.event.id;
  uiState.lastViewedLocationId=location.id;
  mapSelectionActive=true;
  ensureMapVisible(version,()=>{
    const reveal=()=>{
      if(version!==selectionVersion||uiState.selectedLocationId!==location.id)return;
      if(settings.revealMarker)revealMarkerForLocation(location.id,version);
      else highlightSelectedMarker();
      if(settings.openPopup){
        if(MOBILE_QUERY.matches){openMobileVenueSheet(location.venueId,location.event.id,!!settings.preservePopupCards);if(settings.updateHistory)updateEventParam(location.event.id,'push')}
        else openDesktopEventModal(location.event.id,null,settings.updateHistory?'push':false,location.id,!!settings.preservePopupCards);
      }else if(settings.updateHistory)updateEventParam(location.event.id,'push');
    };
    if(settings.recenter)focusMapLocation(location,13,reveal);else reveal();
  });
  return true;
}
function navigateToEvent(eventId,options={}){
  const group=activityGroups.get(eventId);
  if(!group)return false;
  if(group.floating){if(MOBILE_QUERY.matches)setTab('map',{explicitTarget:true});openFloatingEvent(eventId,options.updateHistory!==false);return true}
  const location=primaryLocationFor(group,options.locationId||'');
  return !!location&&selectLocation(location.id,{updateHistory:options.updateHistory!==false,...options});
}
const FLOATING_FORM_GLYPH={'展覽':'▣','快閃店':'▱','主題餐廳':'☕','體驗活動':'★'};

function floatingVisible(group){
  const filters=uiState.filters;
  if(group.status.kind==='ended') return false;
  if(filters.city!=='all') return false; /* 無單一縣市，選特定縣市時不顯示 */
  if(filters.time!=='all'&&!group.locations.some(location=>locationMatchesTimeFilter(location,filters.time))) return false;
  if(filters.form!=='all'&&group.form!==filters.form) return false;
  if(filters.fee!=='all'&&group.fee!==filters.fee) return false;
  if(!groupMatchesQuery(group,uiState.query)) return false;
  return true;
}

let popupCards=[];
let popupCardIndex=0;
let mobileSheetOpenedAt=0;
const NEARBY_RADIUS_M=2000;
function occurrenceDistance(a,b){
  return L.latLng(+a.lat,+a.lng).distanceTo(L.latLng(+b.lat,+b.lng));
}
function buildPopupCards(origin){
  const list=[];
  (DATA.venues||[]).forEach(venue=>{
    getFilteredVenueOccurrences(venue._id).forEach(location=>{
      const group=activityGroups.get(location.event.id);
      if(group&&Number.isFinite(+location.lat)&&Number.isFinite(+location.lng)) list.push({group,location});
    });
  });
  list.sort((a,b)=>(a.location.id===origin.id?-1:b.location.id===origin.id?1:occurrenceDistance(origin,a.location)-occurrenceDistance(origin,b.location)||a.group.title.localeCompare(b.group.title)||a.group.id.localeCompare(b.group.id)));
  return list;
}
function preparePopupCards(origin,preserve=false){
  if(!origin)return;
  if(!preserve||!popupCards.some(card=>card.location.id===origin.id))popupCards=buildPopupCards(origin);
  popupCardIndex=Math.max(0,popupCards.findIndex(card=>card.location.id===origin.id));
}
function buildNearbyActivities(originLocation){
  if(!originLocation||!Number.isFinite(+originLocation.lat)||!Number.isFinite(+originLocation.lng))return [];
  const nearestByEvent=new Map();
  buildPopupCards(originLocation).forEach(item=>{
    if(item.group.id===originLocation.event.id)return;
    const distanceMeters=occurrenceDistance(originLocation,item.location);
    if(distanceMeters>NEARBY_RADIUS_M)return;
    const current=nearestByEvent.get(item.group.id);
    if(!current||distanceMeters<current.distanceMeters)nearestByEvent.set(item.group.id,{eventId:item.group.id,locationId:item.location.id,group:item.group,location:item.location,distanceMeters});
  });
  return [...nearestByEvent.values()].sort((a,b)=>a.distanceMeters-b.distanceMeters||a.group.title.localeCompare(b.group.title)||a.eventId.localeCompare(b.eventId));
}
function formatDistance(distanceMeters){
  if(distanceMeters<1)return '同地點';
  if(distanceMeters<1000)return Math.round(distanceMeters)+' 公尺';
  return (distanceMeters/1000).toFixed(1)+' 公里';
}
function locationDistanceInfo(location){
  if(!uiState.userLocation||!location||!Number.isFinite(+location.lat)||!Number.isFinite(+location.lng))return null;
  const distanceMeters=L.latLng(uiState.userLocation.lat,uiState.userLocation.lng).distanceTo(L.latLng(+location.lat,+location.lng));
  return {location,distanceMeters};
}
function nearestLocationForGroup(group){
  let best=null;
  group.locations.filter(location=>occurrenceVisible(location,uiState.filters)).forEach(location=>{
    const info=locationDistanceInfo(location);if(info&&(!best||info.distanceMeters<best.distanceMeters))best=info;
  });
  return best;
}
function requestDistanceSort(button){
  if(uiState.discoverSort==='distance'){uiState.discoverSort='default';renderAll();return}
  if(!navigator.geolocation){showToast('此瀏覽器不支援定位功能');return}
  button.disabled=true;button.setAttribute('aria-busy','true');
  navigator.geolocation.getCurrentPosition(position=>{
    button.disabled=false;button.removeAttribute('aria-busy');
    const lat=Number(position.coords.latitude),lng=Number(position.coords.longitude);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)){showToast('無法取得目前位置');return}
    uiState.userLocation={lat,lng};uiState.discoverSort='distance';renderAll();
  },error=>{
    button.disabled=false;button.removeAttribute('aria-busy');
    showToast(error&&error.code===1?'未取得定位權限，請允許瀏覽器使用位置':'定位失敗，請稍後再試');
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}

let filterCalendarMonth='';
function initialFilterCalendarMonth(state=uiState){
  const selected=timeFilterDate(state.filters.time);
  return (selected||taipeiCalendarToday()).slice(0,7);
}
function calendarMonthDay(month){return calendarDayNumber(month+'-01')}
function shiftCalendarMonth(month,delta){
  const day=calendarMonthDay(month);if(!Number.isFinite(day))return initialFilterCalendarMonth();
  const date=new Date(day*86400000);date.setUTCMonth(date.getUTCMonth()+delta);
  return date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0');
}
function filterCalendarMaxDay(state=uiState){
  const today=calendarDayNumber(taipeiCalendarToday());let max=today;let hasOpenEnded=false;
  facetBaseGroups(state).forEach(group=>group.locations.forEach(location=>{
    const candidate=eventCalendarDayNumber(location.end||location.start);if(Number.isFinite(candidate))max=Math.max(max,candidate);
    if(!location.end&&(location.status.kind==='ongoing'||location.status.kind==='ending'))hasOpenEnded=true;
  }));
  return hasOpenEnded?Math.max(max,today+365):max;
}
function filterCalendarHtml(state=uiState){
  if(!filterCalendarMonth)filterCalendarMonth=initialFilterCalendarMonth(state);
  const first=calendarMonthDay(filterCalendarMonth),today=calendarDayNumber(taipeiCalendarToday()),maxDay=filterCalendarMaxDay(state);
  const firstDate=new Date(first*86400000),year=firstDate.getUTCFullYear(),month=firstDate.getUTCMonth();
  const daysInMonth=new Date(Date.UTC(year,month+1,0)).getUTCDate();
  const offset=(firstDate.getUTCDay()+6)%7;
  const selected=timeFilterDate(state.filters.time);
  const cells=[];
  for(let i=0;i<42;i++){
    const dayNumber=i-offset+1;
    if(dayNumber<1||dayNumber>daysInMonth){cells.push('<span class="filter-calendar-spacer"></span>');continue}
    const iso=year+'-'+String(month+1).padStart(2,'0')+'-'+String(dayNumber).padStart(2,'0');
    const absolute=calendarDayNumber(iso),count=getFacetCount('time','date:'+iso,state),isSelected=selected===iso,isToday=absolute===today;
    const disabled=(absolute<today||absolute>maxDay||count===0)&&!isSelected;
    cells.push('<button class="filter-calendar-day'+(isSelected?' selected':'')+(isToday?' today':'')+(count>0?' has-events':'')+'" type="button" data-calendar-date="'+iso+'" '+(disabled?'disabled':'')+' aria-pressed="'+(isSelected?'true':'false')+'" aria-label="'+(month+1)+' 月 '+dayNumber+' 日"><span>'+dayNumber+'</span><i aria-hidden="true"></i></button>');
  }
  const prevMonth=shiftCalendarMonth(filterCalendarMonth,-1),nextMonth=shiftCalendarMonth(filterCalendarMonth,1);
  const prevDisabled=calendarMonthDay(prevMonth)<calendarMonthDay(taipeiCalendarToday().slice(0,7));
  const nextDisabled=calendarMonthDay(nextMonth)>calendarMonthDay(new Date(maxDay*86400000).getUTCFullYear()+'-'+String(new Date(maxDay*86400000).getUTCMonth()+1).padStart(2,'0'));
  return '<section class="filter-calendar" aria-label="選擇活動日期"><div class="filter-calendar-label">選擇日期</div><div class="filter-calendar-head"><button type="button" data-calendar-shift="-1" '+(prevDisabled?'disabled':'')+' aria-label="上一個月">‹</button><strong>'+year+' 年 '+(month+1)+' 月</strong><button type="button" data-calendar-shift="1" '+(nextDisabled?'disabled':'')+' aria-label="下一個月">›</button></div><div class="filter-calendar-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="filter-calendar-grid">'+cells.join('')+'</div></section>';
}

function searchSuggestions(value){
  const query=normalizeText(value);
  if(!query) return [];
  const baseState={query:'',filters:uiState.filters};
  const groups=getFilteredActivityGroups(baseState);
  const events=groups.filter(group=>groupMatchesQuery(group,query)).slice(0,7).map(group=>({
    kind:'活動',label:group.title,sub:group.locations.length+' 個地點',eventId:group.id,score:normalizeText(group.title).startsWith(query)?0:1
  }));
  const venues=[];
  (DATA.venues||[]).forEach(venue=>{
    const hay=normalizeText([venue.name,venue.city,venue.addr].join(' '));
    if(hay.includes(query)&&getFilteredVenueOccurrences(venue._id).length) venues.push({kind:'場館',label:venue.name,sub:[venue.city,venue.addr].filter(Boolean).join('・'),venueId:venue._id,score:hay.startsWith(query)?1:2});
  });
  return events.concat(venues).sort((a,b)=>a.score-b.score||a.label.localeCompare(b.label,'zh-Hant')).slice(0,10);
}
function hideSearchSuggestions(except=null){
  [desktopSuggestions,mobileSuggestions].forEach(panel=>{
    if(panel===except) return;
    panel.classList.remove('show');panel.innerHTML='';
    (panel===desktopSuggestions?desktopSearch:mobileSearch).setAttribute('aria-expanded','false');
  });
}
function renderSearchSuggestions(value,input){
  const panel=input===mobileSearch?mobileSuggestions:desktopSuggestions;
  const items=searchSuggestions(value);panel._items=items;panel._active=-1;hideSearchSuggestions(panel);
  if(!normalizeText(value)){panel.classList.remove('show');return}
  panel.innerHTML=items.length?items.map((item,index)=>'<button type="button" class="search-option" role="option" data-index="'+index+'"><span class="search-kind">'+item.kind+'</span><span class="search-copy"><span class="search-label">'+esc(item.label)+'</span><span class="search-sub">'+esc(item.sub)+'</span></span></button>').join(''):'<div class="search-empty">找不到符合的活動或場館</div>';
  panel.classList.add('show');input.setAttribute('aria-expanded','true');
}

function moveSearchSelection(panel,delta){
  const buttons=[...panel.querySelectorAll('.search-option')];
  if(!buttons.length) return;
  panel._active=(Number(panel._active??-1)+delta+buttons.length)%buttons.length;
  buttons.forEach((button,index)=>button.classList.toggle('active',index===panel._active));
  buttons[panel._active].scrollIntoView({block:'nearest'});
}
function wireSearch(input,panel){
  input.addEventListener('input',()=>{
    if(input===desktopSearch) mobileSearch.value=input.value; else desktopSearch.value=input.value;
    renderSearchSuggestions(input.value,input);
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      uiState.query=input.value.trim();
      if(uiState.query){
        if(uiState.exploreView==='home')enterCollection('search');
        else{uiState.collectionContext='search';uiState.collectionVisibleCount=collectionBatchSize();renderAll()}
      }else if(uiState.exploreView==='collection'&&uiState.collectionContext==='search')returnEditorialHome();
      else renderAll();
    },180);
  });
  input.addEventListener('focus',()=>{if(input.value.trim())renderSearchSuggestions(input.value,input)});
  input.addEventListener('keydown',event=>{
    if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(!panel.classList.contains('show'))renderSearchSuggestions(input.value,input);moveSearchSelection(panel,event.key==='ArrowDown'?1:-1)}
    else if(event.key==='Enter'&&panel.classList.contains('show')){event.preventDefault();chooseSuggestion((panel._items||[])[panel._active>=0?panel._active:0])}
    else if(event.key==='Escape')hideSearchSuggestions();
  });
  panel.addEventListener('pointerdown',event=>event.preventDefault());
  panel.addEventListener('click',event=>{const button=event.target.closest('[data-index]');if(button)chooseSuggestion((panel._items||[])[+button.dataset.index])});
}

function trapFocus(event,container){
  if(event.key!=='Tab') return;
  const items=[...container.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(item=>!item.disabled&&item.offsetParent!==null);
  if(!items.length) return;
  const first=items[0],last=items[items.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
}

document.querySelectorAll('[data-marker-mode]').forEach(button=>button.addEventListener('click',()=>setMarkerMode(button.dataset.markerMode)));
document.querySelectorAll('.mobile-tab').forEach(button=>button.addEventListener('click',()=>setTab(button.dataset.tab)));
document.getElementById('filterMenu').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(button)openFilterDetail(button.dataset.filter)});
document.getElementById('filterBack').addEventListener('click',closeFilterDetail);
document.getElementById('filterOptions').addEventListener('click',event=>{
  const shift=event.target.closest('[data-calendar-shift]');if(shift&&!shift.disabled){filterCalendarMonth=shiftCalendarMonth(filterCalendarMonth,+shift.dataset.calendarShift);renderDesktopFilterOptions();return}
  const day=event.target.closest('[data-calendar-date]');if(day&&!day.disabled){uiState.filters.time='date:'+day.dataset.calendarDate;filterCalendarMonth=day.dataset.calendarDate.slice(0,7);closeFilterDetail();renderAll();return}
  const button=event.target.closest('[data-value]');if(!button||button.disabled||!openFilterKey)return;
  const key=openFilterKey,value=button.dataset.value;uiState.filters[key]=value;closeFilterDetail();renderAll();if(key==='city'&&!MOBILE_QUERY.matches){uiState.pendingCityView=null;fitCityView(value)}
});
document.getElementById('clearFilters').addEventListener('click',clearAllFilters);
function openMobileSearchPanel(){const panel=document.getElementById('mobileSearchPanel');panel.classList.add('show');panel.setAttribute('aria-hidden','false');requestAnimationFrame(()=>document.getElementById('mq').focus())}
function closeMobileSearchPanel(){const panel=document.getElementById('mobileSearchPanel');if(!panel)return;panel.classList.remove('show');panel.setAttribute('aria-hidden','true')}
document.getElementById('mobileSearchButton').addEventListener('click',openMobileSearchPanel);
document.getElementById('mobileSearchClose').addEventListener('click',closeMobileSearchPanel);
document.getElementById('mobileFilterButton').addEventListener('click',openMobileFilters);
document.getElementById('mobileFilterClose').addEventListener('click',()=>closeMobileFilters(true));
document.getElementById('mobileFilterBack').addEventListener('click',renderMobileFilterCategories);
document.getElementById('mobileFilterClear').addEventListener('click',()=>{draftFilters={city:'all',time:'all',form:'all',fee:'all',multi:'all'};draftClearSort=true;mobileFilterKey?renderMobileFilterOptions(mobileFilterKey):renderMobileFilterCategories()});
document.getElementById('mobileFilterDone').addEventListener('click',applyMobileFilters);
document.getElementById('mobileFilterContent').addEventListener('click',event=>{
  const category=event.target.closest('[data-mobile-filter]');if(category){renderMobileFilterOptions(category.dataset.mobileFilter);return}
  const shift=event.target.closest('[data-calendar-shift]');if(shift&&!shift.disabled){filterCalendarMonth=shiftCalendarMonth(filterCalendarMonth,+shift.dataset.calendarShift);renderMobileFilterOptions('time');return}
  const day=event.target.closest('[data-calendar-date]');if(day&&!day.disabled){draftFilters.time='date:'+day.dataset.calendarDate;filterCalendarMonth=day.dataset.calendarDate.slice(0,7);renderMobileFilterOptions('time');return}
  const option=event.target.closest('[data-mobile-value]');if(option&&!option.disabled&&mobileFilterKey){draftFilters[mobileFilterKey]=option.dataset.mobileValue;renderMobileFilterOptions(mobileFilterKey)}
});
document.getElementById('mobileFilterOverlay').addEventListener('click',event=>{if(event.target.id==='mobileFilterOverlay')closeMobileFilters(true)});
document.getElementById('mobileFilterGrip').addEventListener('pointerdown',event=>{mobileFilterStartY=event.clientY});
document.getElementById('mobileFilterGrip').addEventListener('pointerup',event=>{if(event.clientY-mobileFilterStartY>70)closeMobileFilters(true)});
document.getElementById('mobileVenueClose').addEventListener('click',closeMobileVenueSheet);
document.getElementById('mobileVenueBody').addEventListener('click',event=>{
  const share=event.target.closest('[data-share]');if(share){shareEvent(share.dataset.share)}
  const nearby=event.target.closest('[data-nearby-location]');if(nearby)openNearbyPicker(nearby.dataset.nearbyLocation);
});
document.getElementById('mobileVenueGrip').addEventListener('pointerdown',event=>{mobileVenueStartY=event.clientY});
document.getElementById('mobileVenueGrip').addEventListener('pointerup',event=>{if(event.clientY-mobileVenueStartY>70)closeMobileVenueSheet()});
wireSearch(desktopSearch,desktopSuggestions);wireSearch(mobileSearch,mobileSuggestions);
document.addEventListener('pointerdown',event=>{if(!event.target.closest('.search-shell'))hideSearchSuggestions()});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  if(document.getElementById('activityPickerOverlay').classList.contains('show'))closeActivityPicker();
  else if(document.getElementById('lightbox').classList.contains('show'))closeImageLightbox();
  else if(document.getElementById('desktopMapCard').classList.contains('show'))closeDesktopMapCard();
  else if(document.getElementById('dialogOverlay').classList.contains('show'))closeDesktopDialog();
  else if(document.getElementById('mobileFilterOverlay').classList.contains('show'))closeMobileFilters(true);
  else closeMobileVenueSheet();
});
window.addEventListener('popstate',()=>{
  const id=new URL(location.href).searchParams.get('event');
  if(!id){closeActiveMapPopup({clearSelection:true,updateHistory:false});return}
  const group=activityGroups.get(id);
  if(!group){closeActiveMapPopup({clearSelection:true,updateHistory:false});return}
  navigateToEvent(id,{updateHistory:false});
});
MOBILE_QUERY.addEventListener('change',()=>{
  closeActiveMapPopup({clearSelection:true,updateHistory:false});document.body.classList.remove('mobile-map');uiState.tab='discover';
  map.setMaxBounds(TW_BOUNDS.pad(MOBILE_QUERY.matches ? .85 : .18));requestAnimationFrame(()=>{map.invalidateSize();renderAll()});
});

(async function start(){
  try{
    const response=await fetch('venues.json',{cache:'no-store'});
    if(response.ok){
      const json=await response.json();
      if(json&&json.venues&&json.venues.length){DATA=json;liveMode=true}
    }
  }catch(error){}
  buildActivityGroups(DATA);
  buildFloatingGroups(Array.isArray(DATA.floating)&&DATA.floating.length?DATA.floating:FLOATING_EVENTS);
  renderAll();
  if(!MOBILE_QUERY.matches){fitTaiwanView();uiState.mapHasVisibleView=true}
  updateExploreViewUI();setTab('discover');handleDeepLink();
})();
</script>
</body></html>
